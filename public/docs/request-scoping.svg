<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="1000" height="430" font-family="Inter, system-ui, sans-serif" role="img" aria-label="How a request is scoped: token, scope resolution, then either scoped data or a 403">
  <defs>
    <marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
    <marker id="fg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/>
    </marker>
    <marker id="fr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect width="1000" height="430" fill="#ffffff"/>

  <text x="32" y="40" font-size="19" font-weight="600" fill="#0f172a">What happens on every request</text>
  <text x="32" y="62" font-size="13" fill="#64748b">The React scope selector shapes the query. The server decides whether to answer it.</text>

  <!-- browser -->
  <rect x="32" y="96" width="196" height="112" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="52" y="122" font-size="10.5" font-weight="700" fill="#94a3b8" letter-spacing="0.5">BROWSER</text>
  <text x="52" y="144" font-size="13" font-weight="600" fill="#0f172a">Scope selector</text>
  <rect x="52" y="152" width="156" height="46" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="64" y="168" font-size="10" fill="#64748b">GET /employees/</text>
  <g font-size="9" font-family="ui-monospace, Menlo, monospace" fill="#2563eb">
    <text x="64" y="181">?organization_id=…</text>
    <text x="64" y="193">&amp;team_id=…</text>
  </g>

  <path d="M 228 152 L 268 152" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#f)"/>

  <!-- get_scope -->
  <rect x="272" y="96" width="216" height="112" rx="12" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="292" y="122" font-size="10.5" font-weight="700" fill="#60a5fa" letter-spacing="0.5">FASTAPI DEPENDENCY</text>
  <text x="292" y="144" font-size="13" font-weight="600" fill="#1e3a8a">get_scope()</text>
  <text x="292" y="166" font-size="10.5" fill="#3b82f6">Walks org → team → member</text>
  <text x="292" y="182" font-size="10.5" fill="#3b82f6">and unions every grant held.</text>
  <text x="292" y="198" font-size="10.5" fill="#3b82f6">Role name is not consulted.</text>

  <path d="M 488 152 L 528 152" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#f)"/>

  <!-- decision -->
  <rect x="532" y="96" width="196" height="112" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="552" y="122" font-size="10.5" font-weight="700" fill="#94a3b8" letter-spacing="0.5">CHECK</text>
  <text x="552" y="146" font-size="12.5" font-weight="600" fill="#0f172a">Is the target inside</text>
  <text x="552" y="164" font-size="12.5" font-weight="600" fill="#0f172a">the resolved scope?</text>
  <rect x="552" y="176" width="156" height="22" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="562" y="191" font-size="9.5" font-family="ui-monospace, Menlo, monospace" fill="#475569">require_employee_access</text>

  <!-- yes branch -->
  <path d="M 728 130 L 780 130" stroke="#059669" stroke-width="1.8" marker-end="url(#fg)"/>
  <text x="738" y="122" font-size="10" font-weight="700" fill="#059669">YES</text>
  <rect x="784" y="104" width="184" height="52" rx="10" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="800" y="126" font-size="12.5" font-weight="600" fill="#065f46">200 · scoped rows</text>
  <text x="800" y="143" font-size="10.5" fill="#047857">Only members in scope.</text>

  <!-- no branch -->
  <path d="M 728 176 L 780 176" stroke="#dc2626" stroke-width="1.8" marker-end="url(#fr)"/>
  <text x="740" y="168" font-size="10" font-weight="700" fill="#dc2626">NO</text>
  <rect x="784" y="160" width="184" height="52" rx="10" fill="#fef2f2" stroke="#fecaca"/>
  <text x="800" y="182" font-size="12.5" font-weight="600" fill="#991b1b">403 · refused</text>
  <text x="800" y="199" font-size="10.5" fill="#b91c1c">Not an empty 200.</text>

  <!-- why note -->
  <rect x="32" y="248" width="936" height="80" rx="12" fill="#fffbeb" stroke="#fde68a"/>
  <text x="56" y="274" font-size="12.5" font-weight="600" fill="#92400e">Why 403 rather than an empty list</text>
  <text x="56" y="296" font-size="11.5" fill="#a16207">An empty 200 still answers the question that was asked. A caller could enumerate ids and watch which ones come back</text>
  <text x="56" y="314" font-size="11.5" fill="#a16207">empty versus populated, turning the endpoint into an existence oracle for people in other organizations.</text>

  <!-- coverage strip -->
  <text x="32" y="362" font-size="10.5" font-weight="700" fill="#64748b" letter-spacing="0.6">ENFORCED ON EVERY MEMBER-DATA SURFACE</text>
  <g font-size="10.5" fill="#475569">
    <rect x="32" y="374" width="96" height="24" rx="12" fill="#f1f5f9" stroke="#e2e8f0"/><text x="52" y="390">Employees</text>
    <rect x="136" y="374" width="76" height="24" rx="12" fill="#f1f5f9" stroke="#e2e8f0"/><text x="156" y="390">Goals</text>
    <rect x="220" y="374" width="86" height="24" rx="12" fill="#f1f5f9" stroke="#e2e8f0"/><text x="240" y="390">Projects</text>
    <rect x="314" y="374" width="70" height="24" rx="12" fill="#f1f5f9" stroke="#e2e8f0"/><text x="332" y="390">Skills</text>
    <rect x="392" y="374" width="70" height="24" rx="12" fill="#f1f5f9" stroke="#e2e8f0"/><text x="410" y="390">Notes</text>
    <rect x="470" y="374" width="64" height="24" rx="12" fill="#f1f5f9" stroke="#e2e8f0"/><text x="488" y="390">1:1s</text>
    <rect x="542" y="374" width="106" height="24" rx="12" fill="#f1f5f9" stroke="#e2e8f0"/><text x="562" y="390">Development</text>
    <rect x="656" y="374" width="120" height="24" rx="12" fill="#f1f5f9" stroke="#e2e8f0"/><text x="676" y="390">Accomplishments</text>
    <rect x="784" y="374" width="86" height="24" rx="12" fill="#f1f5f9" stroke="#e2e8f0"/><text x="804" y="390">Insights</text>
    <rect x="878" y="374" width="90" height="24" rx="12" fill="#f1f5f9" stroke="#e2e8f0"/><text x="898" y="390">Reports</text>
  </g>
</svg>
