<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" font-family="Inter, system-ui, sans-serif" role="img" aria-label="Access is resolved by walking Organization to Team to Member">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
    <marker id="arwBrand" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arwAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d97706"/>
    </marker>
  </defs>

  <rect width="1000" height="620" fill="#ffffff"/>

  <text x="32" y="42" font-size="19" font-weight="600" fill="#0f172a">How access is resolved</text>
  <text x="32" y="64" font-size="13" fill="#64748b">Every check walks the chain. Roles are never consulted for visibility.</text>

  <!-- ============ Organization Alpha ============ -->
  <rect x="32" y="92" width="560" height="330" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="52" y="120" font-size="11" font-weight="700" fill="#64748b" letter-spacing="0.6">ORGANIZATION</text>
  <text x="52" y="142" font-size="16" font-weight="600" fill="#0f172a">Acme Corporation</text>

  <!-- org leader chip -->
  <rect x="380" y="106" width="192" height="44" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
  <circle cx="402" cy="128" r="9" fill="#2563eb"/>
  <text x="396" y="132" font-size="10" font-weight="700" fill="#ffffff">A</text>
  <text x="418" y="124" font-size="11.5" font-weight="600" fill="#1e3a8a">Alice — org leader</text>
  <text x="418" y="139" font-size="10" fill="#3b82f6">sees everything below</text>

  <!-- Team 1 -->
  <rect x="56" y="176" width="248" height="222" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="74" y="202" font-size="10" font-weight="700" fill="#94a3b8" letter-spacing="0.5">TEAM</text>
  <text x="74" y="222" font-size="14" font-weight="600" fill="#0f172a">Platform</text>
  <rect x="74" y="234" width="212" height="34" rx="8" fill="#f1f5f9" stroke="#e2e8f0"/>
  <circle cx="92" cy="251" r="8" fill="#475569"/>
  <text x="87" y="255" font-size="9" font-weight="700" fill="#ffffff">B</text>
  <text x="106" y="255" font-size="11" font-weight="600" fill="#334155">Bob — team lead</text>

  <text x="74" y="290" font-size="10" font-weight="700" fill="#94a3b8" letter-spacing="0.5">MEMBERS</text>
  <rect x="74" y="300" width="212" height="26" rx="7" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="88" y="317" font-size="11" fill="#475569">Dana · Senior Engineer</text>
  <rect x="74" y="332" width="212" height="26" rx="7" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="88" y="349" font-size="11" fill="#475569">Omar · Engineer</text>
  <rect x="74" y="364" width="212" height="26" rx="7" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="88" y="381" font-size="11" fill="#475569">Nina · Engineer</text>

  <!-- Team 2 -->
  <rect x="320" y="176" width="248" height="222" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="338" y="202" font-size="10" font-weight="700" fill="#94a3b8" letter-spacing="0.5">TEAM</text>
  <text x="338" y="222" font-size="14" font-weight="600" fill="#0f172a">Reliability</text>
  <rect x="338" y="234" width="212" height="34" rx="8" fill="#f1f5f9" stroke="#e2e8f0"/>
  <circle cx="356" cy="251" r="8" fill="#475569"/>
  <text x="351" y="255" font-size="9" font-weight="700" fill="#ffffff">C</text>
  <text x="370" y="255" font-size="11" font-weight="600" fill="#334155">Cara — team lead</text>

  <text x="338" y="290" font-size="10" font-weight="700" fill="#94a3b8" letter-spacing="0.5">MEMBERS</text>
  <rect x="338" y="300" width="212" height="26" rx="7" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="352" y="317" font-size="11" fill="#475569">Pia · Staff Engineer</text>
  <rect x="338" y="332" width="212" height="26" rx="7" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="352" y="349" font-size="11" fill="#475569">Theo · Engineer</text>

  <!-- chain arrows -->
  <path d="M 180 160 L 180 172" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arw)"/>
  <path d="M 444 160 L 444 172" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arw)"/>
  <path d="M 180 272 L 180 284" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arw)"/>
  <path d="M 444 272 L 444 284" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arw)"/>

  <!-- ============ Organization Beta ============ -->
  <rect x="620" y="92" width="348" height="330" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="640" y="120" font-size="11" font-weight="700" fill="#64748b" letter-spacing="0.6">ORGANIZATION</text>
  <text x="640" y="142" font-size="16" font-weight="600" fill="#0f172a">Northwind Robotics</text>

  <rect x="644" y="176" width="300" height="222" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="662" y="202" font-size="10" font-weight="700" fill="#94a3b8" letter-spacing="0.5">TEAM</text>
  <text x="662" y="222" font-size="14" font-weight="600" fill="#0f172a">Controls</text>
  <rect x="662" y="234" width="264" height="34" rx="8" fill="#f1f5f9" stroke="#e2e8f0"/>
  <circle cx="680" cy="251" r="8" fill="#475569"/>
  <text x="675" y="255" font-size="9" font-weight="700" fill="#ffffff">G</text>
  <text x="694" y="255" font-size="11" font-weight="600" fill="#334155">Grace — team lead</text>

  <text x="662" y="290" font-size="10" font-weight="700" fill="#94a3b8" letter-spacing="0.5">MEMBERS</text>
  <rect x="662" y="300" width="264" height="26" rx="7" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="676" y="317" font-size="11" fill="#475569">Heidi · Controls Engineer</text>

  <!-- barrier -->
  <line x1="606" y1="92" x2="606" y2="422" stroke="#ef4444" stroke-width="2" stroke-dasharray="6 5"/>
  <rect x="546" y="432" width="122" height="24" rx="12" fill="#fef2f2" stroke="#fecaca"/>
  <text x="560" y="448" font-size="10.5" font-weight="600" fill="#b91c1c">403 across here</text>

  <!-- ============ legend / rules ============ -->
  <rect x="32" y="472" width="936" height="120" rx="14" fill="#ffffff" stroke="#e2e8f0"/>

  <circle cx="60" cy="502" r="7" fill="#2563eb"/>
  <text x="76" y="506" font-size="12.5" font-weight="600" fill="#0f172a">Org leader</text>
  <text x="76" y="523" font-size="11.5" fill="#64748b">Every team and every member inside that organization — and nothing outside it.</text>

  <circle cx="60" cy="552" r="7" fill="#475569"/>
  <text x="76" y="556" font-size="12.5" font-weight="600" fill="#0f172a">Team lead</text>
  <text x="76" y="573" font-size="11.5" fill="#64748b">Only the members of the team they lead. Everyone always sees their own record.</text>

  <line x1="520" y1="490" x2="520" y2="574" stroke="#e2e8f0"/>

  <rect x="548" y="488" width="16" height="16" rx="4" fill="#fef3c7" stroke="#fcd34d"/>
  <text x="574" y="501" font-size="12.5" font-weight="600" fill="#0f172a">Holding both roles</text>
  <text x="548" y="522" font-size="11.5" fill="#64748b">Grants are unioned as sets, so the result is the sum of</text>
  <text x="548" y="538" font-size="11.5" fill="#64748b">both — never one or the other, and never counted twice.</text>
  <rect x="548" y="548" width="392" height="30" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="562" y="567" font-size="11.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#1e3a8a">visible = {orgs led} ∪ {teams led} ∪ {self}</text>
</svg>
