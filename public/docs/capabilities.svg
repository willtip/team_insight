<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700" font-family="Inter, system-ui, sans-serif" role="img" aria-label="Team Insight AI capabilities: scoped access, member profiles, skills framework, analytics, AI assistance and data exchange">
  <defs>
    <linearGradient id="gate" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <marker id="down" viewBox="0 0 10 10" refX="5" refY="9" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 5 9 L 10 0" fill="none" stroke="#cbd5e1" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect width="1000" height="700" fill="#ffffff"/>

  <!-- title -->
  <text x="32" y="44" font-size="21" font-weight="700" fill="#0f172a">Team Insight AI</text>
  <text x="32" y="68" font-size="13" fill="#64748b">Engineering performance management, scoped to the organization and team you actually lead.</text>

  <!-- ===== access gate ===== -->
  <rect x="32" y="92" width="936" height="94" rx="14" fill="url(#gate)"/>
  <text x="56" y="122" font-size="11" font-weight="700" fill="#93c5fd" letter-spacing="0.7">EVERY REQUEST PASSES THROUGH</text>
  <text x="56" y="148" font-size="17" font-weight="600" fill="#ffffff">Scoped access · Organization → Team → Member</text>
  <text x="56" y="170" font-size="12" fill="#bfdbfe">Enforced server-side in FastAPI. Out-of-scope calls return 403, never filtered data.</text>

  <g font-size="11" font-weight="600">
    <rect x="606" y="112" width="152" height="26" rx="13" fill="#ffffff" fill-opacity="0.14"/>
    <text x="622" y="129" fill="#ffffff">Org leader → whole org</text>
    <rect x="606" y="144" width="152" height="26" rx="13" fill="#ffffff" fill-opacity="0.14"/>
    <text x="622" y="161" fill="#ffffff">Team lead → one team</text>
    <rect x="770" y="112" width="174" height="58" rx="12" fill="#ffffff" fill-opacity="0.14"/>
    <text x="786" y="132" fill="#ffffff">Both roles?</text>
    <text x="786" y="150" font-size="10.5" font-weight="400" fill="#dbeafe">Grants are unioned —</text>
    <text x="786" y="163" font-size="10.5" font-weight="400" fill="#dbeafe">no gaps, no duplicates.</text>
  </g>

  <path d="M 500 186 L 500 202" stroke="#cbd5e1" stroke-width="1.5" marker-end="url(#down)"/>

  <!-- ===== four capability columns ===== -->
  <!-- col 1: member profile -->
  <rect x="32" y="212" width="222" height="266" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="32" y="212" width="222" height="4" rx="2" fill="#2563eb"/>
  <text x="52" y="244" font-size="14" font-weight="700" fill="#0f172a">Member profile</text>
  <text x="52" y="262" font-size="10.5" fill="#94a3b8">One page per engineer</text>
  <g font-size="11.5" fill="#475569">
    <text x="52" y="290">Goals</text>
    <text x="52" y="312">Skills</text>
    <text x="52" y="334">Projects</text>
    <text x="52" y="356">Development</text>
    <text x="52" y="378">Accomplishments</text>
    <text x="52" y="400">Notes</text>
    <text x="52" y="422">1:1s</text>
    <text x="52" y="444">Performance</text>
  </g>
  <circle cx="42" cy="286" r="2.5" fill="#93c5fd"/><circle cx="42" cy="308" r="2.5" fill="#93c5fd"/>
  <circle cx="42" cy="330" r="2.5" fill="#93c5fd"/><circle cx="42" cy="352" r="2.5" fill="#93c5fd"/>
  <circle cx="42" cy="374" r="2.5" fill="#93c5fd"/><circle cx="42" cy="396" r="2.5" fill="#93c5fd"/>
  <circle cx="42" cy="418" r="2.5" fill="#93c5fd"/><circle cx="42" cy="440" r="2.5" fill="#93c5fd"/>
  <rect x="52" y="456" width="182" height="1" fill="#f1f5f9"/>

  <!-- col 2: skills framework -->
  <rect x="270" y="212" width="222" height="266" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="270" y="212" width="222" height="4" rx="2" fill="#7c3aed"/>
  <text x="290" y="244" font-size="14" font-weight="700" fill="#0f172a">Skills framework</text>
  <text x="290" y="262" font-size="10.5" fill="#94a3b8">Shared across the org</text>
  <g font-size="11.5" fill="#475569">
    <text x="290" y="290">Capability catalog</text>
    <text x="290" y="312">Anchored 0–5 rubric</text>
    <text x="290" y="334">Role profiles</text>
    <text x="290" y="356">Breadth &amp; depth targets</text>
    <text x="290" y="378">Measurement thresholds</text>
    <text x="290" y="400">Self &amp; reviewer ratings</text>
    <text x="290" y="422">Evidence links</text>
  </g>
  <circle cx="280" cy="286" r="2.5" fill="#c4b5fd"/><circle cx="280" cy="308" r="2.5" fill="#c4b5fd"/>
  <circle cx="280" cy="330" r="2.5" fill="#c4b5fd"/><circle cx="280" cy="352" r="2.5" fill="#c4b5fd"/>
  <circle cx="280" cy="374" r="2.5" fill="#c4b5fd"/><circle cx="280" cy="396" r="2.5" fill="#c4b5fd"/>
  <circle cx="280" cy="418" r="2.5" fill="#c4b5fd"/>

  <!-- col 3: analytics -->
  <rect x="508" y="212" width="222" height="266" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="508" y="212" width="222" height="4" rx="2" fill="#059669"/>
  <text x="528" y="244" font-size="14" font-weight="700" fill="#0f172a">Analytics</text>
  <text x="528" y="262" font-size="10.5" fill="#94a3b8">Computed over your scope</text>
  <g font-size="11.5" fill="#475569">
    <text x="528" y="290">Skills heat map</text>
    <text x="528" y="312">Coverage gaps</text>
    <text x="528" y="334">Bus-factor risk</text>
    <text x="528" y="356">Promotion pipeline</text>
    <text x="528" y="378">Team health score</text>
    <text x="528" y="400">Goal completion</text>
    <text x="528" y="422">Performance bands</text>
  </g>
  <circle cx="518" cy="286" r="2.5" fill="#6ee7b7"/><circle cx="518" cy="308" r="2.5" fill="#6ee7b7"/>
  <circle cx="518" cy="330" r="2.5" fill="#6ee7b7"/><circle cx="518" cy="352" r="2.5" fill="#6ee7b7"/>
  <circle cx="518" cy="374" r="2.5" fill="#6ee7b7"/><circle cx="518" cy="396" r="2.5" fill="#6ee7b7"/>
  <circle cx="518" cy="418" r="2.5" fill="#6ee7b7"/>

  <!-- col 4: AI -->
  <rect x="746" y="212" width="222" height="266" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="746" y="212" width="222" height="4" rx="2" fill="#d97706"/>
  <text x="766" y="244" font-size="14" font-weight="700" fill="#0f172a">AI assistance</text>
  <text x="766" y="262" font-size="10.5" fill="#94a3b8">Prompted with scoped data</text>
  <g font-size="11.5" fill="#475569">
    <text x="766" y="290">Performance summaries</text>
    <text x="766" y="312">Team insights</text>
    <text x="766" y="334">Promotion analysis</text>
    <text x="766" y="356">Natural-language Q&amp;A</text>
    <text x="766" y="378">Meeting-note parsing</text>
    <text x="766" y="400">Coaching suggestions</text>
  </g>
  <circle cx="756" cy="286" r="2.5" fill="#fcd34d"/><circle cx="756" cy="308" r="2.5" fill="#fcd34d"/>
  <circle cx="756" cy="330" r="2.5" fill="#fcd34d"/><circle cx="756" cy="352" r="2.5" fill="#fcd34d"/>
  <circle cx="756" cy="374" r="2.5" fill="#fcd34d"/><circle cx="756" cy="396" r="2.5" fill="#fcd34d"/>
  <rect x="766" y="418" width="184" height="42" rx="9" fill="#fffbeb" stroke="#fde68a"/>
  <text x="778" y="435" font-size="10" fill="#92400e">Never receives members</text>
  <text x="778" y="450" font-size="10" fill="#92400e">outside the caller's scope.</text>

  <!-- ===== data in / out ===== -->
  <rect x="32" y="502" width="936" height="106" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="56" y="530" font-size="11" font-weight="700" fill="#64748b" letter-spacing="0.6">DATA IN &amp; OUT</text>

  <g font-size="11.5">
    <rect x="56" y="544" width="168" height="46" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="70" y="565" font-weight="600" fill="#0f172a">Excel round-trip</text>
    <text x="70" y="580" font-size="10.5" fill="#64748b">Export, edit offline, re-import</text>

    <rect x="238" y="544" width="168" height="46" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="252" y="565" font-weight="600" fill="#0f172a">Bulk import</text>
    <text x="252" y="580" font-size="10.5" fill="#64748b">Staged, reviewed, then applied</text>

    <rect x="420" y="544" width="168" height="46" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="434" y="565" font-weight="600" fill="#0f172a">Self-assessment</text>
    <text x="434" y="580" font-size="10.5" fill="#64748b">In-app intake form</text>

    <rect x="602" y="544" width="168" height="46" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="616" y="565" font-weight="600" fill="#0f172a">Reports</text>
    <text x="616" y="580" font-size="10.5" fill="#64748b">Six templates, scoped</text>

    <rect x="784" y="544" width="160" height="46" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="798" y="565" font-weight="600" fill="#0f172a">Integrations</text>
    <text x="798" y="580" font-size="10.5" fill="#64748b">Entra ID, Degreed, more</text>
  </g>

  <!-- footer -->
  <g font-size="11.5" fill="#94a3b8">
    <text x="32" y="638">Backend: FastAPI · PostgreSQL · Redis</text>
    <text x="330" y="638">Frontend: Next.js · React · TypeScript · Tailwind</text>
    <text x="700" y="638">Auth: Microsoft Entra ID</text>
  </g>
  <rect x="32" y="654" width="936" height="1" fill="#f1f5f9"/>
  <text x="32" y="676" font-size="11" fill="#cbd5e1">The scope selector in the sidebar changes what every page below it queries — it is a convenience, not the boundary.</text>
</svg>
